name: build

on:
  # Pushes to master, and pull requests (running on both for pull request branches would build twice).
  # Caches saved on master are shared with all pull requests.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump when the LLVM build in osmesa-install.sh changes (cmake flags, ...), to rebuild the cached LLVMs.
  LLVM_CACHE_VERSION: v1

jobs:
  macos:
    name: macOS (MacPorts), Mesa ${{ matrix.mesa }}
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - mesa: 25.0.7
            llvm: 19.1.7
            ports: meson ninja py313-mako py313-yaml py313-packaging bison flex
            python: /opt/local/bin/python3.13
            python_select: ""
          - mesa: 18.3.6
            llvm: 6.0.1
            # python313: PYTHON is set to a Python 3, which the script must ignore for Mesa's configure
            ports: python27 python313 autoconf automake libtool gsed
            python: /opt/local/bin/python3.13
            python_select: python27
    env:
      # MacPorts only: no Homebrew in PATH
      PATH: /opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
      # MacPorts installer used to bootstrap MacPorts (selfupdate then updates to the latest release).
      # The suffix must match the runner's macOS version (runs-on).
      MACPORTS_PKG: MacPorts-2.12.7-15-Sequoia.pkg
      MACPORTS_URL: https://github.com/macports/macports-base/releases/download/v2.12.7
    steps:
      - uses: actions/checkout@v7

      - name: Install MacPorts
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -O "$MACPORTS_URL/$MACPORTS_PKG"
          sudo installer -pkg "$MACPORTS_PKG" -target /
          sudo port -N selfupdate

      - name: Install build dependencies
        run: |
          # zstd: used by actions/cache (the cache key depends on the compression method)
          sudo port -N install cmake pkgconfig xz zstd ${{ matrix.ports }}
          if [ -n "${{ matrix.python_select }}" ]; then
            sudo port select --set python ${{ matrix.python_select }}
          fi

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: macos-15-arm64-llvm-${{ matrix.llvm }}-${{ env.LLVM_CACHE_VERSION }}-${{ hashFiles(format('patches/llvm-{0}/*', matrix.llvm)) }}

      # Build LLVM in its own step, and cache it even if the rest of the job fails
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-${{ matrix.llvm }}"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              PYTHON=${{ matrix.python }} MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" = 0
          if [ "${{ matrix.mesa }}" = 18.3.6 ]; then
            # the script must have ignored PYTHON (a Python 3) for Mesa's configure
            grep -q "ignoring PYTHON=" build.log
          fi

      - name: Check the installed libraries and test programs
        run: |
          set -o pipefail
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          # mangled: no gl*/glu* functions, only mgl*/mglu*
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _mglu[A-Z]' || true)" -gt 10
          # the test programs only depend on system libraries (no MacPorts, Homebrew or /usr/local)
          for f in osdemo osdemo16 osdemo32 osmesa_mt_test; do
            p=$(ls build/mesa-demos-*/src/osdemos/$f)
            test -x "$p"
            if otool -L "$p" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "::error::$f depends on non-system libraries"
              exit 1
            fi
          done

  linux:
    name: Linux (Ubuntu 24.04), Mesa ${{ matrix.mesa }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # No Mesa 18.3.6: its configure needs Python 2 (it rejects recent Python 3 versions),
          # which Ubuntu 24.04 doesn't have.
          - mesa: 25.0.7
            llvm: 19.1.7
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config xz-utils zlib1g-dev \
              meson ninja-build python3-mako python3-yaml python3-packaging bison flex \
              freeglut3-dev

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: ubuntu-24.04-x86_64-llvm-${{ matrix.llvm }}-${{ env.LLVM_CACHE_VERSION }}-${{ hashFiles(format('patches/llvm-{0}/*', matrix.llvm)) }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-${{ matrix.llvm }}"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              PYTHON=/usr/bin/python3 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries
        run: |
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T mglu[A-Z]' || true)" -gt 10
