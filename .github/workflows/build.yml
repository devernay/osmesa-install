name: build

# Per change: one Linux, one Windows (MSYS2 UCRT64) and one macOS build, all of Mesa 25.0.7
# (policy for all Natron-related repos).
# - Pushes run CI only on master and tags; feature branches run through their pull request (not on
#   every push, and not twice). Draft pull requests don't run CI. Doc-only changes don't run CI.
# - Superseded runs are cancelled, except for tags.
# - macOS arm64 runners are scarce: macOS starts only once Linux and Windows have passed, and merging
#   only requires Linux and Windows. macOS (and Mesa 18.3.6) are also built nightly (extended.yml).
# - Caches: the LLVM built by the script (Linux, macOS), MacPorts (macOS), MSYS2 packages (Windows).

on:
  push:
    branches: [master]
    tags: ['*']
    paths-ignore: ['**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Bump when the LLVM build in osmesa-install.sh changes (cmake flags, ...), to rebuild the cached LLVMs.
  LLVM_CACHE_VERSION: v1
  MESA_VERSION: 25.0.7
  LLVM_VERSION: 19.1.7

jobs:
  linux:
    name: Linux (Ubuntu 24.04), Mesa 25.0.7
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # about 5 min with a cached LLVM, 35 min when LLVM is built
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config xz-utils zlib1g-dev \
              meson ninja-build python3-mako python3-yaml python3-packaging bison flex \
              freeglut3-dev

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ env.LLVM_VERSION }}
          key: ubuntu-24.04-x86_64-llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ hashFiles(format('patches/llvm-{0}/*', env.LLVM_VERSION)) }}

      # Build LLVM in its own step, and cache it even if the rest of the job fails
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-$LLVM_VERSION"
          cd build
          env OSMESA_VERSION=$MESA_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$LLVM_VERSION" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ env.LLVM_VERSION }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=$MESA_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$LLVM_VERSION" \
              PYTHON=/usr/bin/python3 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries
        run: |
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T mglu[A-Z]' || true)" -gt 10

  windows:
    name: Windows (MSYS2 UCRT64), Mesa 25.0.7
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    # about 8 min
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # LLVM: MSYS2's static LLVM libraries (building LLVM on Windows takes hours).
      # Mesa 18.3.6 is built with SCons and Python 2, which MSYS2 no longer has.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            make patch diffutils tar xz curl bison flex autoconf automake libtool
          pacboy: >-
            gcc:p binutils:p pkgconf:p cmake:p meson:p ninja:p
            python:p python-mako:p python-yaml:p python-packaging:p
            zlib:p llvm:p freeglut:p

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=$MESA_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$MSYSTEM_PREFIX" \
              PYTHON="$MSYSTEM_PREFIX/bin/python3" MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries
        run: |
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T mglu[A-Z]' || true)" -gt 10

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          cat "$HOME/osmesa/lib/pkgconfig/osmesa.pc" || true
          PKG_CONFIG_PATH="$HOME/osmesa/lib/pkgconfig" pkg-config --cflags --libs osmesa || true
          grep -E "^OSMESA_(CFLAGS|LIBS)|^CPPFLAGS|^CFLAGS" build/glu-*/config.log || true
          ls "$HOME/osmesa/include/GL" || true

  macos:
    name: macOS (MacPorts), Mesa 25.0.7
    # macOS arm64 runners are scarce: start only once Linux and Windows have passed.
    # Merging only requires Linux and Windows; macOS is also built nightly (extended.yml).
    needs: [linux, windows]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    # about 5 min with cached MacPorts and LLVM, 35 min when LLVM is built
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install MacPorts (cached)
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports-mesa25.yaml

      - name: MacPorts only (no Homebrew)
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ env.LLVM_VERSION }}
          key: macos-15-arm64-llvm-${{ env.LLVM_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ hashFiles(format('patches/llvm-{0}/*', env.LLVM_VERSION)) }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-$LLVM_VERSION"
          cd build
          env OSMESA_VERSION=$MESA_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$LLVM_VERSION" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ env.LLVM_VERSION }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=$MESA_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$LLVM_VERSION" \
              PYTHON=/opt/local/bin/python3.13 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries and test programs
        run: |
          set -o pipefail
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          # mangled: no gl*/glu* functions, only mgl*/mglu*
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _mglu[A-Z]' || true)" -gt 10
          # the test programs only depend on system libraries (no MacPorts, Homebrew or /usr/local)
          for f in osdemo osdemo16 osdemo32 osmesa_mt_test; do
            p=$(ls build/mesa-demos-*/src/osdemos/$f)
            test -x "$p"
            if otool -L "$p" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "::error::$f depends on non-system libraries"
              exit 1
            fi
          done
