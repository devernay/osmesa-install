name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (MacPorts), Mesa ${{ matrix.mesa }}
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - mesa: 25.0.7
            llvm: 19.1.7
            ports: meson ninja py313-mako py313-yaml py313-packaging bison flex
          - mesa: 18.3.6
            llvm: 6.0.1
            ports: python27 autoconf automake libtool gsed
    env:
      # MacPorts only: no Homebrew in PATH
      PATH: /opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
      MACPORTS_VERSION: 2.12.7
    steps:
      - uses: actions/checkout@v4

      - name: Install MacPorts
        run: |
          pkg="MacPorts-${MACPORTS_VERSION}-15-Sequoia.pkg"
          curl -fsSLO "https://github.com/macports/macports-base/releases/download/v${MACPORTS_VERSION}/${pkg}"
          sudo installer -pkg "$pkg" -target /
          sudo port -N selfupdate

      - name: Install build dependencies
        run: |
          sudo port -N install cmake pkgconfig xz ${{ matrix.ports }}
          if [ "${{ matrix.mesa }}" = 18.3.6 ]; then
            sudo port select --set python python27
          fi

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: macos-15-arm64-llvm-${{ matrix.llvm }}-${{ hashFiles(format('patches/llvm-{0}/*', matrix.llvm)) }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-${{ matrix.llvm }}"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              PYTHON=/opt/local/bin/python3.13 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries
        run: |
          ls -la "$HOME/osmesa/lib"
          test -s "$HOME/osmesa/lib/libMangledOSMesa32.a"
          test -s "$HOME/osmesa/lib/libMangledGLU.a"
          # mangled: no gl* functions, only mgl*
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _gl[A-Z]')" = 0
          nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _mgl'
          # no dependency on Homebrew
          ! otool -L build/mesa-demos-*/src/osdemos/osmesa_mt_test | grep /opt/homebrew

  linux:
    name: Linux (Ubuntu 24.04), Mesa ${{ matrix.mesa }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mesa 18.3.6 needs Python 2 with mako, which Ubuntu 24.04 doesn't have
          - mesa: 25.0.7
            llvm: 19.1.7
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config xz-utils zlib1g-dev \
              meson ninja-build python3-mako python3-yaml python3-packaging bison flex

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: ubuntu-24.04-x86_64-llvm-${{ matrix.llvm }}-${{ hashFiles(format('patches/llvm-{0}/*', matrix.llvm)) }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-${{ matrix.llvm }}"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              PYTHON=/usr/bin/python3 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh

      - name: Check the installed libraries
        run: |
          ls -la "$HOME/osmesa/lib"
          test -s "$HOME/osmesa/lib/libMangledOSMesa32.a"
          test -s "$HOME/osmesa/lib/libMangledGLU.a"
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T gl[A-Z]')" = 0
          nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T mgl'
