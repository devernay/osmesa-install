name: extended

# Builds that must not run on every pull request (policy for all Natron-related repos): macOS
# (arm64 runners are scarce) for Mesa 25.0.7, and the Mesa 18.3.6 variant. Runs nightly, but only if
# master changed in the last 25 hours, and on demand.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same as in build.yml: bump when the LLVM build in osmesa-install.sh changes.
  LLVM_CACHE_VERSION: v1

jobs:
  # Skip the scheduled run if master didn't change since the previous one
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits in the last 25 hours: skipping."
          fi

  macos:
    name: macOS (MacPorts), Mesa ${{ matrix.mesa }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - mesa: 25.0.7
            llvm: 19.1.7
            macports: .github/macports-mesa25.yaml
            python_select: ""
          - mesa: 18.3.6
            llvm: 6.0.1
            macports: .github/macports-mesa18.yaml
            python_select: python27
    env:
      PYTHON: /opt/local/bin/python3.13
    steps:
      - uses: actions/checkout@v7

      - name: Install MacPorts (cached)
        uses: melusina-org/setup-macports@v1
        with:
          parameters: ${{ matrix.macports }}

      - name: MacPorts only (no Homebrew)
        run: |
          echo "PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
          if [ -n "${{ matrix.python_select }}" ]; then
            sudo port select --set python ${{ matrix.python_select }}
          fi

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: macos-15-arm64-llvm-${{ matrix.llvm }}-${{ env.LLVM_CACHE_VERSION }}-${{ hashFiles(format('patches/llvm-{0}/*', matrix.llvm)) }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-${{ matrix.llvm }}"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ matrix.llvm }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa"
          cd build
          env OSMESA_VERSION=${{ matrix.mesa }} OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-${{ matrix.llvm }}" \
              MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" = 0
          if [ "${{ matrix.mesa }}" = 18.3.6 ]; then
            # the script must have ignored PYTHON (a Python 3) for Mesa's configure
            grep -q "ignoring PYTHON=" build.log
          fi

      - name: Check the installed libraries and test programs
        run: |
          set -o pipefail
          ls -la "$HOME/osmesa/lib"
          for lib in libMangledOSMesa32.a libMangledGLU.a; do
            test -s "$HOME/osmesa/lib/$lib"
          done
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _gl[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _glu[A-Z]' || true)" = 0
          test "$(nm -g "$HOME/osmesa/lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _mglu[A-Z]' || true)" -gt 10
          for f in osdemo osdemo16 osdemo32 osmesa_mt_test; do
            p=$(ls build/mesa-demos-*/src/osdemos/$f)
            test -x "$p"
            if otool -L "$p" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "::error::$f depends on non-system libraries"
              exit 1
            fi
          done
