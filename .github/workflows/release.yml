name: release

# Prebuilt OSMesa (static, mangled, llvmpipe + softpipe) with its static LLVM, for openfx-misc's
# Shadertoy and other plug-ins that can't build Mesa and LLVM in their own CI.
#
# Two stages per platform:
# 1. llvm-*: builds LLVM with osmesa-install.sh, only if it is not already cached, and caches it
#    (15 min to 2 h, so it is done once per LLVM version and platform).
# 2. osmesa-*: restores that LLVM from the cache, builds and tests OSMesa, GLU and the osdemos, and
#    packages them with the LLVM libraries they need.
#
# - Tag osmesa-mesa-<mesa version>-llvm-<llvm version> (e.g. osmesa-mesa-25.0.7-llvm-19.1.7): builds
#   every platform. Each platform adds its archives (with ARCHIVE.sha256) to the GitHub release as
#   soon as they pass, the first one creating it as a pre-release, so that no binary is lost if
#   another platform fails. The release job then checks every archive, writes SHA256SUMS and makes it
#   a full release if all five archives are there (release/publish.sh, release/finalize.sh).
#   Fallback when GitHub's macOS runners are unavailable: set the repository variable
#   CI_MACOS_ON_VM=1 before pushing the tag. The macOS jobs then don't run on tags, and
#   release/macos-vm.sh --upload builds the macOS archives in local macOS 14 VMs and adds them. It
#   can also add the macOS archives if the GitHub macOS jobs failed.
#   Likewise for Linux: CI_LINUX_LOCAL=1 skips the Linux jobs on tags, and release/linux-local.sh
#   --upload builds the Linux archives in local rockylinux:9 containers (release/linux-build.sh,
#   the same steps as the Linux jobs) and adds them.
# - workflow_dispatch: builds every platform and keeps the archives as workflow artifacts.
# - Pull requests changing this workflow or release/: build and check everything, upload nothing.

on:
  push:
    tags: ['osmesa-mesa-*-llvm-*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['.github/workflows/release.yml', '.github/macports-mesa25.yaml', 'release/**', 'patches/piglit-*/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_MESA_VERSION: 25.0.7
  CI_LLVM_VERSION: 19.1.7
  # Bump when the LLVM build in osmesa-install.sh changes, to rebuild the cached LLVMs.
  CI_LLVM_CACHE_VERSION: v1

jobs:
  ##################################################################################################
  # Stage 1: LLVM

  llvm-macos:
    name: LLVM, macOS ${{ matrix.arch }}
    # with CI_MACOS_ON_VM=1, not on tags: the macOS release archives are built by release/macos-vm.sh
    if: (github.ref_type != 'tag' || vars.CI_MACOS_ON_VM != '1') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - name: Look for a cached LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ env.CI_LLVM_VERSION }}
          key: release-macos-${{ matrix.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
          lookup-only: true
      - name: Install MacPorts (cached)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports-mesa25.yaml
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin # MacPorts only
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-$CI_LLVM_VERSION"
          cd build
          env OSMESA_VERSION=$CI_MESA_VERSION LLVM_VERSION=$CI_LLVM_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$CI_LLVM_VERSION" \
              BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh
      - name: Cache LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm-${{ env.CI_LLVM_VERSION }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

  llvm-windows:
    name: LLVM, Windows ${{ matrix.arch }} (MSYS2 ${{ matrix.msystem }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # UCRT64: MinGW-w64 gcc and libstdc++; CLANGARM64: clang and libc++
          - {arch: x86_64, msystem: UCRT64, runner: windows-2025, compilers: 'gcc:p binutils:p', cc: gcc, cxx: g++}
          - {arch: aarch64, msystem: CLANGARM64, runner: windows-11-arm, compilers: 'clang:p lld:p', cc: clang, cxx: clang++}
    # building LLVM takes 1.5-2 h on a Windows runner
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: Look for a cached LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: llvm-${{ env.CI_LLVM_VERSION }}
          key: release-windows-${{ matrix.msystem == 'UCRT64' && 'ucrt64' || 'clangarm64' }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
          lookup-only: true
      - uses: msys2/setup-msys2@v2
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: make patch diffutils tar xz curl
          pacboy: ${{ matrix.compilers }} cmake:p python:p
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          llvm="$PWD/llvm-$CI_LLVM_VERSION"
          mkdir -p build "$HOME/osmesa" "$llvm"
          cd build
          env OSMESA_VERSION=$CI_MESA_VERSION LLVM_VERSION=$CI_LLVM_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$llvm" \
              CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} BUILD_OSMESA=0 BUILD_GLU=0 BUILD_OSDEMO=0 MKJOBS=$(nproc) \
              bash ../osmesa-install.sh
      - name: Cache LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: llvm-${{ env.CI_LLVM_VERSION }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

  llvm-linux:
    name: LLVM, Linux ${{ matrix.arch }} (Rocky 9, gcc-toolset-14)
    # with CI_LINUX_LOCAL=1, not on tags: the Linux release archives are built by release/linux-local.sh
    if: (github.ref_type != 'tag' || vars.CI_LINUX_LOCAL != '1') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - name: Install git (for actions/checkout)
        run: dnf install -y git
      - uses: actions/checkout@v7
      - name: Install the build tools
        run: bash release/linux-build.sh deps-llvm
      - name: Look for a cached LLVM
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: /root/llvm-${{ env.CI_LLVM_VERSION }}
          key: release-linux-rocky9-gcc14-${{ matrix.arch }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
          lookup-only: true
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash release/linux-build.sh llvm
      - name: Cache LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /root/llvm-${{ env.CI_LLVM_VERSION }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

  ##################################################################################################
  # Stage 2: OSMesa, with the cached LLVM

  osmesa-macos:
    name: OSMesa, macOS ${{ matrix.arch }}
    needs: llvm-macos
    # also when the other architecture's LLVM failed (LLVM is then built here if not cached)
    if: ${{ !cancelled() && needs.llvm-macos.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240 # 90 min, plus LLVM if its cache is missing
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x86_64, runner: macos-15-intel}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      NAME: osmesa-install-osmesa-mesa-25.0.7-llvm-19.1.7-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      # if the cache is missing (e.g. its save failed), osmesa-install.sh builds LLVM (LLVM_BUILD=auto)
      - name: Restore LLVM
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm-${{ env.CI_LLVM_VERSION }}
          key: release-macos-${{ matrix.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
      - name: Install MacPorts (cached)
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macports-mesa25.yaml
      - name: MacPorts only (no Homebrew)
        run: echo "PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
      - name: Build OSMesa, GLU and osdemo
        run: |
          mkdir -p build "$HOME/osmesa" "$HOME/llvm-$CI_LLVM_VERSION"
          cd build
          env OSMESA_VERSION=$CI_MESA_VERSION LLVM_VERSION=$CI_LLVM_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$HOME/llvm-$CI_LLVM_VERSION" \
              PYTHON=/opt/local/bin/python3.13 MKJOBS=$(sysctl -n hw.ncpu) \
              bash ../osmesa-install.sh
      - name: Check the libraries
        run: |
          set -o pipefail
          lib="$HOME/osmesa/lib"
          test "$(nm -g "$lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _gl[A-Z]' || true)" = 0
          test "$(nm -g "$lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T _mgl[A-Z]' || true)" -gt 1000
          test "$(nm -g "$lib/libMangledGLU.a" 2>/dev/null | grep -c ' T _glu[A-Z]' || true)" = 0
          # architecture and minimum macOS version of every object
          lipo -info "$lib/libMangledOSMesa32.a" | grep -w "${{ matrix.arch }}"
          for a in "$lib/libMangledOSMesa32.a" "$lib/libMangledGLU.a" "$HOME/llvm-$CI_LLVM_VERSION/lib/libLLVMCore.a"; do
            minos=$(otool -l "$a" | awk '/minos/ {print $2}' | sort -u | tr '\n' ' ')
            echo "$a: minos $minos"
            test "$minos" = "$MACOSX_DEPLOYMENT_TARGET "
          done
          # the test programs only depend on system libraries
          for f in osdemo osdemo16 osdemo32 osmesa_mt_test; do
            p=$(ls build/mesa-demos-*/src/osdemos/$f)
            if otool -L "$p" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "::error::$f depends on non-system libraries"; exit 1
            fi
          done
      - name: Package
        run: |
          mkdir -p out
          echo "  macOS $(sw_vers -productVersion) runner, $(xcodebuild -version | head -1), Apple clang $(clang -dumpversion), MacPorts, MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" > "out/$NAME.buildinfo"
          bash release/package.sh "$NAME" "$HOME/osmesa" "$HOME/llvm-$CI_LLVM_VERSION" build out \
              "macOS ${MACOSX_DEPLOYMENT_TARGET} and later, ${{ matrix.arch }}"
          tar tJf "out/$NAME.tar.xz" | sed -n 1,40p
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}.tar.xz
          if-no-files-found: error

  osmesa-windows:
    name: OSMesa, Windows ${{ matrix.arch }} (MSYS2 ${{ matrix.msystem }})
    needs: llvm-windows
    # also when the other architecture's LLVM failed (LLVM is then built here if not cached)
    if: ${{ !cancelled() && needs.llvm-windows.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, msystem: UCRT64, runner: windows-2025, compilers: 'gcc:p binutils:p', cc: gcc, cxx: g++}
          - {arch: aarch64, msystem: CLANGARM64, runner: windows-11-arm, compilers: 'clang:p lld:p', cc: clang, cxx: clang++}
    timeout-minutes: 360 # 60 min, plus LLVM if its cache is missing
    defaults:
      run:
        shell: msys2 {0}
    env:
      NAME: osmesa-install-osmesa-mesa-25.0.7-llvm-19.1.7-windows-${{ matrix.msystem == 'UCRT64' && 'ucrt64' || 'clangarm64' }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      # if the cache is missing (e.g. its save failed), osmesa-install.sh builds LLVM (LLVM_BUILD=auto)
      - name: Restore LLVM
        uses: actions/cache/restore@v6
        with:
          path: llvm-${{ env.CI_LLVM_VERSION }}
          key: release-windows-${{ matrix.msystem == 'UCRT64' && 'ucrt64' || 'clangarm64' }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            make patch diffutils tar xz curl bison flex autoconf automake libtool
          pacboy: >-
            ${{ matrix.compilers }} pkgconf:p cmake:p meson:p ninja:p
            python:p python-mako:p python-yaml:p python-packaging:p
            zlib:p freeglut:p
      - name: Build OSMesa, GLU and osdemo
        run: |
          llvm="$PWD/llvm-$CI_LLVM_VERSION"
          mkdir -p build "$HOME/osmesa" "$llvm"
          cd build
          env OSMESA_VERSION=$CI_MESA_VERSION LLVM_VERSION=$CI_LLVM_VERSION OSMESA_PREFIX="$HOME/osmesa" LLVM_PREFIX="$llvm" \
              CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PYTHON="$MSYSTEM_PREFIX/bin/python3" MKJOBS=$(nproc) \
              bash ../osmesa-install.sh
      - name: Check the libraries
        run: |
          lib="$HOME/osmesa/lib"
          # binutils (UCRT64) or LLVM's tools (CLANGARM64)
          nm=$(command -v nm || command -v llvm-nm); objdump=$(command -v objdump || command -v llvm-objdump)
          test "$($nm -g "$lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T gl[A-Z]' || true)" = 0
          test "$($nm -g "$lib/libMangledOSMesa32.a" 2>/dev/null | grep -c ' T mgl[A-Z]' || true)" -gt 1000
          test "$($nm -g "$lib/libMangledGLU.a" 2>/dev/null | grep -c ' T glu[A-Z]' || true)" = 0
          # the test programs only need Windows system DLLs (no MSYS2 DLLs), and are for this architecture
          for f in osdemo osdemo16 osdemo32 osmesa_mt_test; do
            p=$(ls build/mesa-demos-*/src/osdemos/$f.exe)
            file "$p" | grep -E "${{ matrix.arch == 'aarch64' && 'Aarch64|ARM64' || 'x86-64' }}"
            deps=$($objdump -p "$p" | sed -n 's/^\s*DLL Name: //p')
            echo "$f:" $deps
            if echo "$deps" | grep -viE '^(kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|uuid|ws2_32|psapi|dbghelp|ntdll|bcrypt|synchronization|msvcrt|ucrtbase|opengl32|api-ms-win-.*)\.dll$'; then
              echo "::error::$f depends on non-system DLLs"; exit 1
            fi
          done
      - name: Package
        run: |
          mkdir -p out
          echo "  ${{ matrix.runner }} runner, MSYS2 ${{ matrix.msystem }}, $(${{ matrix.cc }} --version | head -1), for Windows 10 and later" > "out/$NAME.buildinfo"
          bash release/package.sh "$NAME" "$HOME/osmesa" "$PWD/llvm-$CI_LLVM_VERSION" build out \
              "${{ matrix.arch == 'aarch64' && 'Windows 11 and later, ARM64, MSYS2 CLANGARM64 (clang, libc++, UCRT)' || 'Windows 10 and later, x86_64, MSYS2 UCRT64 (MinGW-w64 gcc, UCRT)' }}"
          tar tJf "out/$NAME.tar.xz" | sed -n 1,40p
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}.tar.xz
          if-no-files-found: error

  osmesa-linux:
    name: OSMesa, Linux ${{ matrix.arch }} (Rocky 9, gcc-toolset-14)
    needs: llvm-linux
    # also when the other architecture's LLVM failed (LLVM is then built here if not cached)
    if: ${{ !cancelled() && needs.llvm-linux.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    timeout-minutes: 300 # 90 min, plus LLVM if its cache is missing, plus piglit (up to 60 min)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    env:
      NAME: osmesa-install-osmesa-mesa-25.0.7-llvm-19.1.7-linux-${{ matrix.arch }}
    steps:
      - name: Install git (for actions/checkout)
        run: dnf install -y git
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: bash release/linux-build.sh deps
      # if the cache is missing (e.g. its save failed), osmesa-install.sh builds LLVM (LLVM_BUILD=auto)
      - name: Restore LLVM
        uses: actions/cache/restore@v6
        with:
          path: /root/llvm-${{ env.CI_LLVM_VERSION }}
          key: release-linux-rocky9-gcc14-${{ matrix.arch }}-llvm-${{ env.CI_LLVM_VERSION }}-${{ env.CI_LLVM_CACHE_VERSION }}
      - name: Build OSMesa, GLU and osdemo
        run: bash release/linux-build.sh osmesa
      - name: Check the libraries
        run: bash release/linux-build.sh check ${{ matrix.arch }}
      - name: Package
        run: bash release/linux-build.sh package "$NAME" ${{ matrix.arch }}
      - name: Test the archive with CMake (find_package(OSMesa CONFIG), OSMesa::OSMesa)
        run: bash release/linux-build.sh test-cmake "$NAME"
      - name: Test the archive with pkg-config (pkg-config --static --cflags --libs osmesa)
        run: bash release/linux-build.sh test-pkgconfig "$NAME"
      # release gate: piglit's OpenGL tests on the archive (release/piglit.sh), compared with Mesa's
      # llvmpipe CI expectations and ours (patches/piglit-*/osmesa-*.txt): new failures fail the job,
      # so the archive isn't published
      - name: piglit (OpenGL tests on OSMesa)
        # about 10-15 min on GitHub's 4-CPU runners (piglit's build, sanity and llvmpipe_gl)
        timeout-minutes: 60
        run: |
          bash release/piglit.sh deps > /tmp/piglit-deps.log 2>&1 || { tail -n 30 /tmp/piglit-deps.log; exit 1; }
          WORK=/root/piglit-work JOBS=$(nproc) bash release/piglit.sh all "out/$NAME.tar.xz" sanity llvmpipe_gl
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          # not "-linux-": the publish job downloads the archives with that pattern
          name: piglit-results-${{ matrix.arch }}
          path: /root/piglit-work/results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}.tar.xz
          if-no-files-found: error

  ##################################################################################################
  # Publish (tags only): each platform adds its archives to the release as soon as they are built
  # (the first one creates it as a pre-release), even if another platform fails, so that no binary
  # is lost; then the release job checks everything and makes it a full release.

  publish-macos:
    name: Publish, macOS
    needs: osmesa-macos
    # !cancelled(): also publish one architecture if the other one failed
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/osmesa-mesa-') && needs.osmesa-macos.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-macos-*'
          path: assets
          merge-multiple: true
      - name: Add the archives to the release
        run: |
          test "$TAG" = "osmesa-mesa-$CI_MESA_VERSION-llvm-$CI_LLVM_VERSION"
          ls assets/*.tar.xz || { echo "::error::no macOS archive was built"; exit 1; }
          bash release/publish.sh "$TAG" assets/*.tar.xz

  publish-windows:
    name: Publish, Windows
    needs: osmesa-windows
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/osmesa-mesa-') && needs.osmesa-windows.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-windows-*'
          path: assets
          merge-multiple: true
      - name: Add the archives to the release
        run: |
          test "$TAG" = "osmesa-mesa-$CI_MESA_VERSION-llvm-$CI_LLVM_VERSION"
          ls assets/*.tar.xz || { echo "::error::no Windows archive was built"; exit 1; }
          bash release/publish.sh "$TAG" assets/*.tar.xz

  publish-linux:
    name: Publish, Linux
    needs: osmesa-linux
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/osmesa-mesa-') && needs.osmesa-linux.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-linux-*'
          path: assets
          merge-multiple: true
      - name: Add the archives to the release
        run: |
          test "$TAG" = "osmesa-mesa-$CI_MESA_VERSION-llvm-$CI_LLVM_VERSION"
          ls assets/*.tar.xz || { echo "::error::no Linux archive was built"; exit 1; }
          bash release/publish.sh "$TAG" assets/*.tar.xz

  release:
    name: Check the release, and make it a full release if every platform is there
    needs: [publish-macos, publish-windows, publish-linux]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/osmesa-mesa-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the archives, update SHA256SUMS, publish
        run: |
          # with CI_MACOS_ON_VM=1 or CI_LINUX_LOCAL=1, those archives may be missing:
          # release/macos-vm.sh --upload or release/linux-local.sh --upload adds them and finalizes
          ALLOW_MISSING=
          if [ "${{ vars.CI_MACOS_ON_VM }}" = 1 ]; then
            ALLOW_MISSING="$ALLOW_MISSING macos-arm64 macos-x86_64"
          fi
          if [ "${{ vars.CI_LINUX_LOCAL }}" = 1 ]; then
            ALLOW_MISSING="$ALLOW_MISSING linux-x86_64 linux-aarch64"
          fi
          export ALLOW_MISSING
          bash release/finalize.sh "$TAG"
